[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seekdrop"
version = "0.4.0"
description = "Follow SoundCloud channels and playlists and fetch the tracks from Soulseek, through Nicotine+ or its own login."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aioslsk>=1.7,<2",
  "yt-dlp[default,curl-cffi]>=2026.10.26",
  "aiohttp>=3.9",
  "platformdirs>=4",
  "pywebview>=6",
  "numpy>=2",
  "anyascii>=0.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]
seekdrop = "seekdrop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seekdrop = ["ui/*", "ui/fonts/*", "nicotine_plugin/seekdrop_bridge/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
